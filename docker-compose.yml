services:
  migration:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sisat_migration
    restart: "no"
    command: ["bunx", "--bun", "prisma", "db", "push"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql://sisat:sisat_local_password@host.docker.internal:3306/sisat}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sisat_backend
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      HOST: "0.0.0.0"
      DATABASE_URL: ${DATABASE_URL:-mysql://sisat:sisat_local_password@host.docker.internal:3306/sisat}
      JWT_SECRET: ${JWT_SECRET:-development_secret_key_123}
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-dev}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migration:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sisat_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://backend:3000}
    depends_on:
      - backend
